<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mudora</title>
<style>
  /* iPad / iPhone: holding a finger on a check opens its card (long press);
     without this iOS selected text or showed "Copy" instead. Typing boxes keep it. */
  @media (pointer: coarse) {
    body *:not(input):not(textarea):not([contenteditable]) { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  }
  html { touch-action: manipulation; }
  :root { --bg: #101214; --panel: #171a1d; --line: #2a2f35; --text: #d7dde3; --dim: #7d8791; --gold: #e8c45a;
    --c-green: #4dff88; --c-yellow: #ffe14d; --c-orange: #ff8c00; --c-purple: #a35cf0; --c-red: #ff4b4b; --c-done: #3a3f44;
    --isz: 32px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.3 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  button, select { font: inherit; color: inherit; }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ── top bar ── */
  #bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 4px 8px; background: #0b0c0e; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #brand { font-weight: 700; letter-spacing: .08em; color: var(--gold); display: flex; align-items: center; gap: 6px; }
  #brand img { width: 20px; height: 20px; image-rendering: pixelated; }
  #bar label { display: flex; align-items: center; gap: 4px; color: var(--dim); }
  #bar select { background: #1d2126; border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; }
  #bar .sp { flex: 1; }
  #bar button { background: #1d2126; border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; cursor: pointer; }
  #link { display: flex; align-items: center; gap: 5px; color: var(--dim); }
  #link i { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; }
  #link.on i { background: var(--c-green); }

  /* ── body ── */
  #main { flex: 1 1 auto; min-height: 0; display: flex; }
  #side { flex: none; width: max(250px, calc(var(--isz) * 6 + 40px)); max-width: 50%; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
  #side h3 { margin: 0; padding: 4px 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); background: #121417; border-bottom: 1px solid var(--line); }
  #maps { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

  /* items */
  #items { display: grid; grid-template-columns: repeat(6, var(--isz)); gap: 4px; padding: 8px; justify-content: center; }
  .it { position: relative; width: var(--isz); height: var(--isz); cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
  .it:hover { background: #22272c; }
  .it img { width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
  .it.off img { filter: grayscale(1) brightness(.4); }
  .it.two img { position: absolute; width: 70%; height: 70%; }
  .it.two img:first-child { left: 0; top: 0; } .it.two img:last-child { right: 0; bottom: 0; }
  .it .tx { font: 700 calc(var(--isz) * .42)/1 system-ui, sans-serif; color: var(--text); }
  .it.off .tx { color: #444; }
  .it .lbl { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font: 700 9px/1 system-ui, sans-serif; color: #fff;
    text-shadow: 0 0 2px #000, 0 0 2px #000; pointer-events: none; }
  .it .lbl.ok { color: #9f9; }

  /* dungeons panel */
  #dungeons { padding: 6px; display: grid; grid-template-columns: 1fr; gap: 3px; }
  .dg { display: grid; grid-template-columns: 34px 26px 1fr auto; align-items: center; gap: 5px; padding: 3px 6px; border-radius: 5px;
    background: #1b1f23; border-left: 4px solid var(--c-red); cursor: pointer; }
  .dg:hover { background: #22272c; }
  .dg.green { border-color: var(--c-green); } .dg.yellow { border-color: var(--c-yellow); } .dg.orange { border-color: var(--c-orange); }
  .dg.purple { border-color: var(--c-purple); } .dg.done { border-color: var(--c-done); opacity: .6; }
  .dg .nm { font-weight: 700; }
  .dg .nm img.rv { width: 14px; height: 14px; margin-left: 3px; vertical-align: -2px; image-rendering: pixelated; filter: drop-shadow(0 0 1px #000); }
  .dg .pz { width: 26px; height: 24px; image-rendering: pixelated; display: flex; align-items: center; justify-content: center; color: var(--dim); font-weight: 700; }
  .dg .pz img, .dghere .hp img { width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; }
  /* the prize: grey until it's yours, then bright with a glow in its own colour (HydeOut) */
  .pz.no img, .hp.no img { filter: grayscale(1) brightness(.42); opacity: .8; }
  .pz.got img, .hp.got img { filter: brightness(1.3) saturate(1.5) drop-shadow(0 0 2px var(--glow, #fff)) drop-shadow(0 0 4px var(--glow, #fff)); }
  .pz.crystal, .hp.crystal { --glow: #6fb6ff; } .pz.crystal_red, .hp.crystal_red { --glow: #ff5c5c; }
  .pz.pendant_blue, .hp.pendant_blue { --glow: #6fb6ff; } .pz.pendant_green, .hp.pendant_green { --glow: #5ee37a; }
  .pin.dgn img.pzi { left: 0; top: 0; width: 16px; height: 16px; object-fit: contain; filter: grayscale(.6) brightness(.8) drop-shadow(0 0 1px #000); }
  .pin.dgn img.pzi.got { filter: brightness(1.2) drop-shadow(0 0 2px #fff); }
  /* this dungeon: the card for the dungeon Link is in */
  .dghere { margin: 4px 6px 8px; min-height: 76px; display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; padding: 6px 8px;
    border-radius: 8px; background: #1b1f23; border: 1px solid #2c3238; }
  .dghere.empty > * { visibility: hidden; }
  .dghere .hb { width: 64px; height: 64px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; }
  .dghere .hb img { max-width: 64px; max-height: 64px; image-rendering: pixelated; }
  .dghere.beaten .hb img { filter: grayscale(1) brightness(.5); }
  .dghere.beaten .hb::after { content: '✓'; position: absolute; right: 0; bottom: -2px; font: 900 20px/1 system-ui, sans-serif; color: #5ee37a; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .dghere .hm { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .dghere .ht { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .dghere .hn { font-size: 14px; color: #fff; }
  .dghere .hp { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--dim); font-weight: 700; }
  .dghere .hk { display: inline-flex; align-items: center; gap: 4px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .dghere .hk .kc.done { color: #2ecc71; } .dghere .hk img.bk { width: 18px; height: 18px; image-rendering: pixelated; }
  .dghere .hc { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; cursor: pointer; }
  .dghere .hc img.ch { width: 18px; height: 18px; image-rendering: pixelated; }
  .dghere .hc img.ch.open { opacity: .55; }
  .dghere .hc .hl { margin-left: 4px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .dghere .hc .hl.none { color: #2ecc71; }
  #dungeons .dg { order: 0; }
  /* "This dungeon only": just the card (for stream) */
  body.dg-here-only #dungeons, body.dg-here-only #side .h-dg { display: none; }
  .dg .pz { position: relative; }
  .dg .pz .plus { position: absolute; right: -4px; top: -5px; font: 900 12px/1 system-ui, sans-serif; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 3px #000; pointer-events: none; }
  .dg .pz .plus.red { color: #ff6b6b; } .dg .pz .plus.green { color: #5ee37a; }
  .dg .row { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .dg .ic { width: 18px; height: 18px; image-rendering: pixelated; }
  .dg .ic.off { filter: grayscale(1) brightness(.35); }
  .dg .n { font-variant-numeric: tabular-nums; min-width: 26px; text-align: right; font-weight: 700; }
  .dg .n.zero { color: var(--dim); font-weight: 400; }
  .dg .key { color: var(--gold); font-variant-numeric: tabular-nums; }
  .dg .key.done { color: #2ecc71; }

  /* world / dungeon buttons */
  .dg-bar { flex: none; display: flex; gap: 2px; padding: 3px; overflow-x: auto; background: #0e1012; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .dg-bar::-webkit-scrollbar { display: none; }
  .dg-btn { flex: none; background: #1d2126; color: #9aa; border: 1px solid #2c3238; border-radius: 4px; padding: 2px 7px; font-size: 12px; cursor: pointer; }
  .dg-btn.seen { color: #ddd; }
  .dg-btn.here { box-shadow: inset 0 -2px var(--gold); }
  .dg-btn.on { background: #3a4652; color: #fff; border-color: #6b7c8c; }
  #worlds { flex: 1 1 auto; min-height: 0; display: flex; gap: 2px; }
  #worlds.stack { flex-direction: column; }
  .wv { position: relative; flex: 1 1 0; min-width: 0; min-height: 0; overflow: hidden; background: #050607; cursor: grab; touch-action: none; }
  .wv .wcv { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wv .pins { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .wv .pins .pin { pointer-events: auto; }
  .wv .wreset { position: absolute; right: 6px; top: 4px; z-index: 4; width: 28px; height: 26px; padding: 0; border-radius: 5px; cursor: pointer;
    background: #1d2126d9; border: 1px solid #4a535c; color: #fff; font-size: 16px; line-height: 1; }
  .wv .wreset:hover { background: #303840; }
  .wv .wname { position: absolute; left: 8px; top: 6px; z-index: 3; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .pin { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; transform: scale(var(--pz, 1)); border-radius: 3px;
    border: 2px solid #000; background: var(--c-red); cursor: pointer; z-index: 2; }
  .pin.dgn { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border-width: 3px; }
  .pin.green { background: var(--c-green); } .pin.yellow { background: var(--c-yellow); } .pin.orange { background: var(--c-orange); }
  .pin.purple { background: var(--c-purple); } .pin.done { background: #2a2d30; border-color: #555; z-index: 1; }
  .pin.gone { display: none; }
  .pin img { position: absolute; left: -2px; top: -22px; width: 20px; height: 20px; image-rendering: pixelated; pointer-events: none;
    filter: drop-shadow(0 0 2px #000); }
  .pin.hl { outline: 3px solid #fff; }
  /* entrances (entrance shuffle) */
  .pin.ent { width: 12px; height: 12px; margin: -6px 0 0 -6px; background: none; border: 0; border-radius: 0; z-index: 3; }
  .pin.ent > i { position: absolute; inset: 0; border: 1.5px solid #000; background: var(--c-green); border-radius: 50%; }
  .pin.ent.diamond > i { border-radius: 1px; transform: rotate(45deg); }
  .pin.ent.square > i { border-radius: 2px; }
  .pin.ent.red > i { background: var(--c-red); } .pin.ent.yellow > i { background: var(--c-yellow); } .pin.ent.purple > i { background: var(--c-purple); }
  .pin.ent.orange > i { background: var(--c-orange); } .pin.ent.partial > i { background: var(--c-partial, #12a150); } .pin.ent.green > i { background: var(--c-green); }
  .pin.ent.conn > i { background: #ED18E2; }
  .pin.ent.done > i { background: #2a2d30 !important; border-color: #555; }
  .pin.ent.done { z-index: 1; }
  .pin.ent.pend > i { box-shadow: 0 0 0 3px #fff; }
  .pin.ent .tag { position: absolute; left: 13px; top: -5px; padding: 0 3px; font: 700 9px/12px system-ui, sans-serif; color: #fff; background: #000c;
    border: 1.5px solid #888; border-radius: 3px; white-space: nowrap; pointer-events: none; }
  .pins.notag .pin.ent .tag { display: none; }
  #card { max-height: 80vh; overflow-y: auto; }
  #card .sub { margin: 8px 0 3px; font-size: 11px; color: var(--dim); }
  #card .codes { display: flex; flex-wrap: wrap; gap: 3px; }
  #card .codes .code { padding: 2px 6px; font-size: 11px; color: #fff; text-shadow: 0 1px 2px #000, 0 0 2px #000; border: 1px solid #0006; }
  #card .codes .code.on { outline: 2px solid #fff; }

  .dg-view { flex: 1 1 auto; position: relative; overflow: hidden; background: #0a0a0a; min-height: 0; cursor: grab; }
  .dg-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .dg-room { position: absolute; width: 512px; height: 512px; }
  .dg-inner.sharp .dg-room { image-rendering: pixelated; }
  .dg-link { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #3fd25b; border: 3px solid #fff; box-shadow: 0 0 6px #000; z-index: 3; }
  .dg-note { position: absolute; left: 12px; right: 12px; top: 40%; text-align: center; color: #888; pointer-events: none; }
  .dg-note.top { top: 6px; color: #cbd; text-shadow: 0 1px 2px #000; }
  .dg-floor { position: absolute; height: 220px; font: bold 150px/220px system-ui, sans-serif; color: #c9d3dd; white-space: nowrap; }
  .dg-cell { position: absolute; width: 512px; height: 512px; border: 18px solid transparent; border-radius: 28px; display: flex; align-items: center; justify-content: center; }
  .dg-cell.known { background: #18263a; border-color: #34506f; }
  .dg-cell.seen { background: #2f6aa8; border-color: #cfe4ff; }
  .dg-cell.here { box-shadow: 0 0 0 26px #ffd166; }
  .dg-skull { display: none; font-size: 300px; line-height: 1; color: #fff; text-shadow: 0 0 30px #a00; }
  .dg-cell.boss .dg-skull { display: block; }

  /* footer */
  #foot { flex: none; display: flex; align-items: center; gap: 14px; padding: 3px 8px; background: #0b0c0e; border-top: 1px solid var(--line); flex-wrap: wrap; font-size: 12px; }
  #stats b { color: #fff; font-variant-numeric: tabular-nums; }
  #stats span { margin-right: 10px; color: var(--dim); }
  #legend { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; color: var(--dim); }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 1px solid #000; }

  /* card */
  #card { position: fixed; z-index: 50; min-width: 200px; max-width: 280px; background: #1b1f24; border: 1px solid #3b434b; border-radius: 8px;
    box-shadow: 0 8px 30px rgba(0,0,0,.6); padding: 8px; display: none; }
  #card.show { display: block; }
  #card h4 { margin: 0 24px 4px 0; font-size: 14px; }
  #card .st { font-size: 12px; margin-bottom: 6px; }
  #card .st i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  #card .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  #card button { background: #262c32; border: 1px solid #3b434b; border-radius: 5px; padding: 4px 9px; cursor: pointer; }
  #card button:hover { background: #303840; }
  #card .x { position: absolute; right: 6px; top: 4px; border: 0; background: none; font-size: 16px; padding: 0 4px; }
  #card .pick { display: grid; grid-template-columns: repeat(7, 28px); gap: 3px; margin-top: 8px; }
  #card .pick button { width: 28px; height: 28px; padding: 2px; }
  #card .pick img { width: 100%; height: 100%; image-rendering: pixelated; }

  #toast { position: fixed; left: 50%; top: 44px; transform: translateX(-50%); background: #1d2126; border: 1px solid var(--gold); border-radius: 8px;
    padding: 6px 12px; z-index: 60; display: none; max-width: 90%; }

  /* phone: one panel at a time (Rando Hub's tabs pick it) */
  body.phone #bar { display: none; }
  /* phone: the options open over the map (⚙), so the map keeps its room */
  body.phone.bar-open #bar { display: flex; position: fixed; left: 0; right: 0; top: 0; z-index: 55; padding: 8px 10px; gap: 8px 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.7); border-bottom: 1px solid #3b434b; }
  body.phone #bar #legend { width: 100%; margin: 2px 0 0; gap: 8px; font-size: 11px; }
  body.phone #foot { flex-wrap: nowrap; overflow: hidden; white-space: nowrap; }
  body.phone.bar-open #gear { background: #3a4652; }
  #gear { display: none; position: fixed; right: 6px; bottom: 4px; z-index: 40; background: #1d2126cc; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
  body.phone #gear { display: block; }
  body.phone #side { width: 100%; max-width: none; border: 0; }
  body.phone.ph-lw #side, body.phone.ph-dw #side { display: none; }
  body.phone.ph-items #maps, body.phone.ph-keys #maps { display: none; }
  body.phone.ph-items #side .h-dg, body.phone.ph-items #dungeons { display: none; }
  body.phone.ph-keys #side .h-items, body.phone.ph-keys #items { display: none; }
  body.phone.ph-keys #legend { display: none; }
  body.phone.ph-keys .h-dg { display: none; }
  body.phone.ph-keys #dungeons { padding: 4px 6px; gap: 2px; }
  body.phone.ph-keys .dg { padding: 2px 8px; font-size: 14px; }
  body.phone #foot { padding-right: 44px; font-size: 11px; gap: 8px; }
  body.phone #foot #legend { margin-left: 0; gap: 8px; }
  body.phone.ph-items #legend { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span id="brand"><img id="brand-ic" alt=""> MUDORA</span>
    <label title="How dungeon maps are shown">Dungeons <select id="dgmode"></select></label>
    <label title="How big the item pictures are">Items <select id="isize"><option value="auto">Auto</option><option value="28">Small</option><option value="36">Medium</option><option value="46">Large</option></select></label>
    <label title="The game's screens as a grid on the maps"><input type="checkbox" id="o-grid"> Grid</label>
    <label title="Open a dungeon's map when Link goes in (off: the world map stays up)"><input type="checkbox" id="o-follow"> Follow into dungeons</label>
    <label title="The dungeon list: in the game's order, the ones you can clear first, or only the dungeon Link is in (compact, for stream)">List <select id="dglist"><option value="all">All dungeons</option><option value="ready">Ready first</option><option value="here">This dungeon only</option></select></label>
    <span id="link" title="Hutch's logic, read live from the game"><i></i><span id="link-t">Starting…</span></span>
    <span class="sp"></span>
    <button id="b-reset" type="button" title="Put the maps back as they started (whole world, no zoom)">Reset maps</button>
    <button id="b-help" type="button" title="How to use it">?</button>
  </div>
  <div id="main">
    <div id="side">
      <h3 class="h-items">Items</h3>
      <div id="items"></div>
      <h3 class="h-dg">Dungeons</h3>
      <div id="dungeons"></div>
      <div id="dghere" class="dghere empty" title="The dungeon Link is in"></div>
    </div>
    <div id="maps">
      <div class="dg-bar" id="dgbar"></div>
      <div id="worlds"></div>
      <div class="dg-view" id="dgview" style="display:none"></div>
    </div>
  </div>
  <div id="foot">
    <span id="stats"></span>
    <span id="legend">
      <span><i style="background:var(--c-green)"></i>Available</span>
      <span><i style="background:var(--c-yellow)"></i>Possible</span>
      <span><i style="background:var(--c-orange)"></i>Visible</span>
      <span><i style="background:var(--c-purple)"></i>Out of logic</span>
      <span><i style="background:var(--c-red)"></i>Not yet</span>
      <span><i style="background:#2a2d30;border-color:#555"></i>Done</span>
    </span>
  </div>
</div>
<button id="gear" type="button" title="Options">&#9881;</button>
<div id="card"></div>
<div id="toast"></div>
<script src="../addons/keys-client.js"></script>
<script src="../emotracker/romap.js"></script>
<script src="mudora.js"></script>
<script src="entrack.js"></script>
<script src="../emotracker/dungeons.js"></script>
<script src="ui.js"></script>
</body>
</html>
