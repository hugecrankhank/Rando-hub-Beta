<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmoTracker</title>
<!--
  EmoTracker for the web (beta): runs an EmoTracker pack inside Rando Hub.
  emo.js = the model (items, locations, logic, Lua, autotracking),
  ui.js = the layouts. Credits and licenses: README.md in this folder.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b1b1b; color: #e8e8e8;
    font: 12px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #bar { flex: none; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 4px 6px;
    background: #111; border-bottom: 1px solid #333; }
  #bar label { display: flex; align-items: center; gap: 4px; color: #9aa; }
  #bar select, #bar button { background: #222; color: #e8e8e8; border: 1px solid #444; border-radius: 4px;
    padding: 2px 6px; font: inherit; cursor: pointer; }
  #bar .sp { flex: 1; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #666; display: inline-block; }
  #dot.on { background: #3fd25b; box-shadow: 0 0 6px #3fd25b; }
  #stat { color: #9aa; }
  body.clean #bar { display: none; }
  #root { flex: 1; min-height: 0; position: relative; overflow: auto; }
  #msg { padding: 20px; color: #9aa; }

  /* layouts */
  .emo-root { min-height: 100%; height: 100%; }
  .l-container { display: flex; flex-direction: column; height: 100%; }
  .l-container > * { flex: 1 1 auto; min-height: 0; }
  .l-dock-root { display: flex; height: 100%; width: 100%; min-height: 0; }
  .l-dock-root > * { flex: 1 1 auto; min-width: 0; min-height: 0; }
  .l-dock { display: flex; min-width: 0; min-height: 0; width: 100%; height: 100%; }
  .l-dock.row { flex-direction: row; }
  .l-dock.col { flex-direction: column; }
  .l-dock > .docked { flex: none; overflow: auto; }
  /* a docked child takes only the room it needs along the docking edge */
  .l-dock.row > .docked { width: auto !important; height: 100%; max-width: 70%; }
  .l-dock.col > .docked { height: auto !important; width: 100%; max-height: 70%; }
  .l-dock.row > .docked.l-dock-root, .l-dock.col > .docked.l-dock-root { display: flex; }
  .l-dock.col > .docked.l-dock-root > .l-dock, .l-dock.col > .docked .l-dock { height: auto; }
  .l-dock.row > .docked.l-dock-root > .l-dock, .l-dock.row > .docked .l-dock { width: auto; }
  .l-dock > .l-dock-rest { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; }
  .l-dock-rest > * { flex: 1 1 auto; min-width: 0; min-height: 0; }
  .l-array { display: flex; min-width: 0; }
  .l-array.col { flex-direction: column; }
  .l-array.row { flex-direction: row; }
  .l-array.wrap { flex-wrap: wrap; }
  [data-h="center"] { align-self: center; }
  [data-h="left"] { align-self: flex-start; }
  [data-h="right"] { align-self: flex-end; }
  [data-h="stretch"] { align-self: stretch; }
  .l-group { display: flex; flex-direction: column; min-height: 0; background: #2b2b2b; }
  .l-head { display: flex; align-items: center; gap: 6px; padding: 3px 6px; font-weight: 600; letter-spacing: .02em; }
  .l-title { flex: 1; }
  .l-body { flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
  .l-body > * { flex: 0 0 auto; }
  .l-dock > .docked.l-group > .l-body, .l-dock > .docked > .l-body { overflow: visible; }
  .shadow { box-shadow: 0 1px 5px rgba(0,0,0,.45); }
  .l-grid { display: flex; flex-direction: column; align-items: center; padding: 2px; }
  .l-row { display: flex; }
  .it { position: relative; cursor: pointer; user-select: none; -webkit-user-select: none; flex: none; }
  .it.static, .it.blank { cursor: default; }
  .it .pic, .hosted .pic, .l-image { position: relative; display: block; width: 100%; height: 100%; }
  .it img, .hosted img, .l-image img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    image-rendering: pixelated; pointer-events: none; }
  .it .badge { position: absolute; right: -1px; bottom: -3px; font: bold 12px/1 system-ui, sans-serif; color: whitesmoke;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; pointer-events: none; }
  .l-popbtn { position: relative; }
  .l-gear { background: transparent; border: 0; color: #ddd; cursor: pointer; font-size: 14px; padding: 0 2px; }
  .l-popup { position: absolute; z-index: 30; right: 0; top: 100%; padding: 6px; border-radius: 6px; min-width: 160px;
    box-shadow: 0 6px 18px rgba(0,0,0,.6); }
  .l-tabs { display: flex; flex-direction: column; height: 100%; }
  .l-tabbar { display: flex; gap: 2px; }
  .l-tab { background: #222; color: #ccc; border: 1px solid #444; padding: 2px 8px; cursor: pointer; }
  .l-tab.on { background: #3e4b57; color: #fff; }
  .l-tabbody { flex: 1; min-height: 0; }
  .l-canvas { position: relative; }
  .unsupported { min-width: 20px; min-height: 20px; outline: 1px dashed #844; }

  /* maps */
  .l-maps { display: flex; align-items: center; justify-content: center; gap: 2px; width: 100%; height: 100%;
    min-width: 0; min-height: 0; overflow: hidden; background: #000; }
  .l-maps.col { flex-direction: column; }
  .map { position: relative; flex: none; }
  .map svg { display: block; width: 100%; height: 100%; }
  .map image { image-rendering: pixelated; }
  .map .pin { cursor: pointer; }
  /* World / dungeon buttons and the dungeon map */
  .l-mapwrap { display: flex; flex-direction: column; width: 100%; height: 100%; min-width: 0; min-height: 0; }
  .l-mapwrap > .l-maps { flex: 1 1 auto; height: auto; }
  .dg-bar { flex: none; display: flex; gap: 2px; padding: 2px; overflow-x: auto; background: #111; scrollbar-width: none; }
  .dg-bar::-webkit-scrollbar { display: none; }
  .dg-btn { flex: none; background: #222; color: #9aa; border: 1px solid #333; border-radius: 4px; padding: 2px 6px;
    font: 600 11px/1.3 system-ui, sans-serif; cursor: pointer; }
  .dg-btn.seen { color: #ddd; }
  .dg-btn.here { box-shadow: inset 0 -2px #ffd166; }
  .dg-btn.on { background: #3e4b57; color: #fff; border-color: #6b7c8c; }
  .dg-view { flex: 1 1 auto; position: relative; overflow: hidden; background: #0a0a0a; min-height: 0; cursor: grab; }
  .dg-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .dg-room { position: absolute; width: 512px; height: 512px; }
  .dg-inner.sharp .dg-room { image-rendering: pixelated; }
  .dg-link { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #3fd25b; border: 3px solid #fff;
    box-shadow: 0 0 10px #3fd25b; pointer-events: none; }
  .dg-note { position: absolute; left: 12px; right: 12px; top: 40%; text-align: center; color: #888; }
  body.phone .dg-btn { padding: 4px 8px; font-size: 12px; }
  /* the squares and item marks keep their size when zoomed in */
  .map .pin, .map image.cap { transform-box: fill-box; transform-origin: center; transform: scale(calc(1 / var(--z, 1))); }
  .map .grid line { stroke: rgba(0, 0, 0, .55); stroke-width: 1px; vector-effect: non-scaling-stroke; }
  body.no-grid .map .grid { display: none; }
  .map.rom .tiles image { image-rendering: auto; }
  .map.rom.zoomed .tiles image { image-rendering: pixelated; }
  .map.zoomed svg { cursor: grab; }
  .map { overflow: hidden; }
  .map .pin:hover { stroke: #fff; }

  /* locations */
  .loc-pop { position: fixed; z-index: 100; min-width: 200px; max-width: 320px; padding: 6px 8px; background: #212121;
    border: 1px solid #555; border-radius: 6px; box-shadow: 0 8px 22px rgba(0,0,0,.7); }
  .pop-head { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
  .pop-title { flex: 1; font-weight: 700; }
  .pop-btn { background: #2b2b2b; color: #ddd; border: 1px solid #444; border-radius: 4px; cursor: pointer; padding: 0 5px; font-size: 12px; }
  .pop-btn.on { border-color: #3fd25b; }
  .sec { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .sec-name { flex: 1; }
  .sec-chests { display: flex; align-items: center; gap: 2px; cursor: pointer; user-select: none; }
  .chest { width: 20px; height: 20px; image-rendering: pixelated; }
  .cnt { font-weight: 700; margin-left: 2px; }
  .hosted { width: 24px; height: 24px; display: inline-block; cursor: pointer; }
  .l-pins { display: flex; gap: 4px; padding: 4px; align-items: flex-start; min-height: 30px; }
  .l-pins.col { flex-direction: column; align-items: stretch; }
  .l-pins.row { flex-direction: row; flex-wrap: wrap; }
  .pin-card { background: #262626; border: 1px solid #3a3a3a; border-radius: 5px; padding: 4px 6px; min-width: 160px; }
  .pins-empty { color: #888; font-style: italic; padding: 4px; }
  /* counters and the map key */
  #foot { flex: none; display: flex; flex-wrap: wrap; gap: 3px 14px; align-items: center; padding: 3px 8px; background: #111;
    border-top: 1px solid #333; font-size: 11.5px; color: #bbb; }
  #stats { display: flex; flex-wrap: wrap; gap: 2px 12px; }
  #stats b { color: #fff; font-variant-numeric: tabular-nums; }
  #stats .gtk b { color: #ffd166; }
  #legend { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-left: auto; }
  #legend i { display: inline-block; width: 10px; height: 10px; border: 1px solid #000; margin-right: 4px; vertical-align: -1px; }
  body.clean #foot { display: none; }
  .map image.cap { pointer-events: none; image-rendering: pixelated; }
  .mark { width: 22px; height: 22px; flex: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    border: 1px dashed #555; border-radius: 4px; color: #888; font-weight: 700; position: relative; }
  .mark.empty:hover { color: #fff; border-color: #888; }
  .mark .pic { position: absolute; inset: 0; }
  .mark .pic img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .pick { position: fixed; z-index: 150; width: 280px; max-width: calc(100vw - 8px); padding: 6px 8px; background: #212121;
    border: 1px solid #666; border-radius: 6px; box-shadow: 0 8px 22px rgba(0,0,0,.7); }
  .pick-sec { width: 100%; margin: 2px 0 6px; background: #2b2b2b; color: #eee; border: 1px solid #444; border-radius: 4px; }
  .pick-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 6px; }
  .pick-it { position: relative; aspect-ratio: 1; background: #2b2b2b; border: 1px solid #3a3a3a; border-radius: 4px; cursor: pointer; padding: 0; }
  .pick-it:hover { border-color: #3fd25b; }
  .pick-it .pic img { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); object-fit: contain; image-rendering: pixelated; }
  .sec { touch-action: manipulation; -webkit-touch-callout: none; user-select: none; }
  /* phone (Rando Hub's tabs): one panel, no scrolling; the menu folds behind ⚙ */
  body.phone #root { overflow: hidden; }
  body.phone #bar { display: none; }
  body.phone.bar-open #bar { display: flex; }
  #phone-gear { display: none; position: fixed; z-index: 60; top: 4px; right: 4px; width: 34px; height: 30px; padding: 0;
    background: rgba(17,17,17,.85); color: #ddd; border: 1px solid #444; border-radius: 6px; font-size: 16px; }
  body.phone #phone-gear { display: block; }
  body.phone.bar-open #phone-gear { border-color: #3fd25b; }
  body.phone.phone-items .emo-root { width: max-content; height: auto; min-height: 0; margin: 0 auto; }
  body.phone.phone-items .l-container, body.phone.phone-items .l-array { height: auto; }
  body.phone #legend { display: none; }
  body.phone.foot-map #legend { display: flex; margin-left: 0; }
  body.phone.foot-map #stats { display: none; }
  body.phone #foot { font-size: 11px; padding: 2px 6px; }
  body.phone #legend i { width: 8px; height: 8px; }
  #toast { position: fixed; z-index: 200; left: 50%; top: 40px; transform: translateX(-50%); background: #212121;
    border: 1px solid #3fd25b; border-radius: 8px; padding: 8px 12px; white-space: pre-wrap; max-width: 90%; }
</style>
</head>
<body>
<div id="bar">
  <label title="Which of the pack's trackers to use">Tracker <select id="variant"></select></label>
  <label title="How the tracker is laid out">View <select id="view"></select></label>
  <label title="Map: the game's screens as a grid"><input type="checkbox" id="o-grid"> Grid</label>
  <label title="Draw the maps from the game itself (sharp, and the seed's own map). Off: the pack's pictures."><input type="checkbox" id="o-rommap"> Game maps</label>
  <label title="How big the item icons are">Items <select id="isize"><option value="auto">Auto</option><option value="1">Small</option><option value="1.5">Medium</option><option value="2">Large</option></select></label>
  <span title="Autotracking: reads the game as you play"><span id="dot"></span> <span id="stat">Waiting for the game</span></span>
  <span class="sp"></span>
  <button id="b-reset" type="button" title="Clear everything you've marked for this tracker">Reset</button>
  <button id="b-help" type="button" title="How to use it">?</button>
</div>
<button id="phone-gear" type="button" title="Tracker options" aria-label="Tracker options">&#9881;</button>
<div id="root"><div id="msg">Loading EmoTracker pack…</div></div>
<div id="foot">
  <span id="stats" title="From the game: items found, deaths, bonks, and Ganon's Tower chests opened"></span>
  <span id="legend"></span>
</div>
<script src="fengari-web.js"></script>
<script src="emo.js"></script>
<script src="romap.js"></script>
<script src="dungeons.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  var E = window.EmoWeb, $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  if (params.get('clean') === '1') document.body.classList.add('clean');
  var VIEW_KEY = 'rhb-emo-view';
  var VIEWS = [['auto', 'Auto'], ['tracker_default', 'Items beside map'], ['tracker_horizontal', 'Items below map'],
               ['tracker_broadcast', 'Broadcast'], ['shared_item_grid', 'Items only']];
  var view = 'auto';
  try { view = localStorage.getItem(VIEW_KEY) || 'auto'; } catch (e) {}
  // one picked in this menu wins (Rando Hub clears it when its own settings change)
  var variant = null;
  try { variant = localStorage.getItem('rhb-emo-variant'); } catch (e) {}
  variant = variant || params.get('variant');

  function pickLayout() {
    var v = view;
    if (v === 'auto') {
      var r = $('root'), w = r.clientWidth, h = r.clientHeight;
      v = !E.maps.length ? 'tracker_default' : (w >= 760 && w > h * 1.1 ? 'tracker_default' : 'tracker_horizontal');
    }
    if (!E.layouts[v]) v = E.layouts.tracker_default ? 'tracker_default' : Object.keys(E.layouts)[0];
    return v;
  }
  var current = null, curScale = null;
  var SIZE_KEY = 'rhb-emo-isize', isize = 'auto';
  try { isize = localStorage.getItem(SIZE_KEY) || 'auto'; } catch (e) {}
  function pickScale() {
    if (isize !== 'auto') return +isize || 1;
    var w = $('root').clientWidth, h = $('root').clientHeight;
    // bigger icons when there's room: 48 px on a wide window, 32 on a narrow one
    return w >= 1050 && h >= 600 ? 1.5 : 1;
  }
  // ── phone: one panel at a time (Rando Hub's Items / Light World / Dark
  //    World tabs), fitted to the space with no scrolling ─────────────────────
  var phone = params.get('phone') || null;   // 'items' | 'lw' | 'dw'
  function phoneLayouts() {
    var names = E.maps.map(function (m) { return m.name; });
    E.layouts.__phone_items = { type: 'array', orientation: 'vertical', content: [{ type: 'layout', key: 'shared_item_grid' }] };
    E.layouts.__phone_lw = { type: 'map', maps: [names.filter(function (n) { return !/dark/i.test(n); })[0] || names[0]] };
    E.layouts.__phone_dw = { type: 'map', maps: [names.filter(function (n) { return /dark/i.test(n); })[0] || names[1] || names[0]] };
  }
  function fitItems() {
    var root = $('root'), n = root.querySelector('.emo-root');
    if (!n || !document.body.classList.contains('phone-items')) return;
    n.style.zoom = '';
    var W = root.clientWidth, H = root.clientHeight, w = n.scrollWidth, h = n.scrollHeight;
    if (!W || !H || !w || !h) return;
    n.style.zoom = String(Math.max(0.5, Math.min(4, W / w, H / h)));
  }
  function draw(force) {
    var k = pickLayout(), sc = pickScale();
    if (phone && E.maps.length) { k = '__phone_' + phone; sc = 1; }
    else if (phone) { k = '__phone_items'; sc = 1; }
    document.body.classList.toggle('phone', !!phone);
    document.body.classList.toggle('phone-items', !!phone && k === '__phone_items');
    if (k === current && sc === curScale && !force) { fitItems(); return; }
    current = k; curScale = sc; E.itemScale = sc;
    E.render($('root'), k);
    fitItems();
    paintFoot();
  }
  function paintFoot() {
    document.body.classList.toggle('foot-map', !!phone && phone !== 'items');
  }
  // Rando Hub's phone tabs call this (emo-host.js)
  window.EmoPhone = {
    set: function (t) {
      t = t === 'lw' || t === 'dw' || t === 'items' ? t : null;
      if (t === phone) return;
      phone = t;
      if (E.layouts.shared_item_grid) draw(true);
    },
    zoom: function (dir) {
      var v = document.querySelector('.map svg');
      if (!v) return;
      var r = v.getBoundingClientRect();
      v.dispatchEvent(new WheelEvent('wheel', { deltaY: dir > 0 ? -100 : 100, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, ctrlKey: true, bubbles: true, cancelable: true }));
    },
  };
  window.addEventListener('resize', function () { setTimeout(fitItems, 30); });

  E.load(variant).then(function () {
    phoneLayouts();
    var vs = E.manifest.variants || {};
    Object.keys(vs).forEach(function (k) {
      var o = document.createElement('option'); o.value = k; o.textContent = vs[k].display_name || k; $('variant').appendChild(o);
    });
    $('variant').value = E.variant;
    VIEWS.forEach(function (v) {
      if (v[0] !== 'auto' && !E.layouts[v[0]]) return;
      var o = document.createElement('option'); o.value = v[0]; o.textContent = v[1]; $('view').appendChild(o);
    });
    $('view').value = view;
    if ($('view').value !== view) $('view').value = view = 'auto';
    draw(true);
    paintLegend();
    var t = null;
    window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(function () { draw(false); }, 120); });
    if (E.log.some(function (l) { return /error/i.test(l); })) console.warn('EmoTracker pack messages:', E.log);
  }).catch(function (e) {
    $('msg').textContent = 'Couldn’t load the EmoTracker pack: ' + (e && e.message || e);
  });

  $('variant').addEventListener('change', function () {
    try { localStorage.setItem('rhb-emo-variant', this.value); } catch (e) {}
    params.set('variant', this.value);
    location.search = params.toString();
  });
  var gridOn = true;
  try { gridOn = localStorage.getItem('rhb-emo-grid') !== '0'; } catch (e) {}
  $('o-grid').checked = gridOn; document.body.classList.toggle('no-grid', !gridOn);
  $('o-grid').addEventListener('change', function () {
    document.body.classList.toggle('no-grid', !this.checked);
    try { localStorage.setItem('rhb-emo-grid', this.checked ? '1' : '0'); } catch (e) {}
  });
  $('o-rommap').checked = E.romMapsOn;
  $('o-rommap').addEventListener('change', function () { E.setRomMaps(this.checked); });
  $('phone-gear').addEventListener('click', function () {
    document.body.classList.toggle('bar-open');
    setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 30);
  });
  $('isize').value = isize;
  $('isize').addEventListener('change', function () {
    isize = this.value;
    try { localStorage.setItem(SIZE_KEY, isize); } catch (e) {}
    draw(true);
  });
  $('view').addEventListener('change', function () {
    view = this.value;
    try { localStorage.setItem(VIEW_KEY, view); } catch (e) {}
    draw(true);
  });
  $('b-reset').addEventListener('click', function () {
    if (confirm('Clear everything marked on this tracker? (Autotracking fills it back in from the game.)')) E.reset();
  });
  $('b-help').addEventListener('click', function () {
    alert('EmoTracker (beta)\n\n' +
      'Items: click to add or turn on, right click to take away.\n' +
      'Map: point at a square (or tap it) to see its checks. Click a chest when you’ve collected it (right click to undo). ' +
      '✓ marks all of it collected, ↺ reopens it (not collected), 📌 pins it to Pinned Locations, ✕ or Esc closes the card.\n' +
      'Right click a square (hold it on a phone or tablet) to mark which item is there; it shows on the map.\n\n' +
      'Colors: green = in logic, yellow = possible with a sequence break, blue = can look at it, ' +
      'orange = only some of it, red = not yet, gray = done.\n\n' +
      'Autotracking reads the game as you play, so most of this fills in on its own.');
  });
  E.onStatus = function (on) {
    $('dot').classList.toggle('on', on);
    $('stat').textContent = on ? 'Autotracking' : 'Waiting for the game';
  };
  // counters from the game, and the map key
  var LEG = [[6, 'In logic'], [5, 'Sequence break'], [3, 'Can see it'], [1, 'Some of it'], [2, 'Needs a key'], [0, 'Not yet'], [7, 'Done']];
  function paintLegend() {
    if (!E.maps.length) { $('legend').textContent = ''; return; }
    $('legend').innerHTML = LEG.map(function (l) { return '<span><i style="background:' + E.COLORS[l[0]] + '"></i>' + l[1] + '</span>'; }).join('');
  }
  function paintStats(st) {
    if (!st) { $('stats').innerHTML = ''; return; }
    var gtTxt = st.gtFound ? (st.gtAt != null ? 'Big key: chest <b>#' + st.gtAt + '</b>' : 'Big key: found') : 'chests <b>' + st.gtOpened + '</b>/26';
    $('stats').innerHTML = '<span>Checks <b>' + st.checks + '</b></span><span>Deaths <b>' + st.deaths + '</b></span><span>Bonks <b>' + st.bonks + '</b></span>' +
      '<span class="gtk" title="Ganon\'s Tower: chests opened (26, not Bob\'s Torch), and which chest had the big key">GT ' + gtTxt + '</span>';
  }
  E.onStats = paintStats;
  E.notify = function (md) {
    var t = document.createElement('div'); t.id = 'toast';
    t.textContent = md.replace(/[#*]/g, '').replace(/\|/g, ' ').replace(/^\s*-+\s*$/gm, '').trim();
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 12000);
  };
})();
</script>
