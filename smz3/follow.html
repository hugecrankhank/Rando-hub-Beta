<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="version" content="1.14.137">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map (follows the game) - Rando Hub</title>
<!--
  One window for a stream's map: it shows the map of the game being played and
  changes by itself with every warp. Opened by "⧉ Map (follows)" on the SMZ3 and
  Rando Cross pages (../smz3/js/z3pick.js); everything is read from that page.
    Hyrule (ALttP)   the Zelda tracker's two maps (Mudora 2.0 / Mudora / Hutch, z3host.html)
    Zebes (SM)       Super Metroid's map, drawn here by js/map.js from the page's game
    Zelda 1, Metroid the NES tracker's map (../cross/nes-tracker.html, Rando Cross only)
  ?game=z3|sm|z1|m1 pins one (no following).
-->
<style>
  html, body { margin: 0; height: 100%; background: #0b0f16; color: #e6edf3; font: 14px system-ui, sans-serif; overflow: hidden; }
  .pane { position: absolute; inset: 0; display: none; }
  .pane.on { display: block; }
  .pane iframe { width: 100%; height: 100%; border: 0; display: block; background: #1b1b1b; }
  #p-sm { display: none; flex-direction: column; } #p-sm.on { display: flex; }
  #g-smmap { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  #hidden-map { position: absolute; width: 1px; height: 1px; overflow: hidden; left: -10px; top: -10px; }
  #wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9aa6c6; text-align: center; padding: 20px; }
  /* the map viewer (../world-map.js), as on the SMZ3 page */
  :root { --cell: #141b38; --cell-line: #2a3868; --dim: #9aa6c6; --gold: #ffb22e; --green: #3fb950; --text: #eef2fa; --px: system-ui, sans-serif; --body: system-ui, sans-serif; }
  .m-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 4px 4px 0; background: var(--cell); border-bottom: 2px solid var(--cell-line); }
  .m-tabs button { background: none; border: 0; padding: 5px 7px; font: 400 13px/1 var(--px); color: var(--dim); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
  .m-tabs button small { display: block; font-size: 10px; margin-top: 3px; color: var(--dim); }
  .m-tabs button.done small { color: var(--green); }
  .m-tabs button[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); }
  .m-tabs .m-sp { flex: 1; }
  .m-tabs .m-follow, .m-tabs .m-fit { font-size: 12px; padding: 5px 7px 7px; color: var(--dim); border-bottom: 0; }
  .m-tabs .m-follow[aria-pressed="true"] { color: #ff7a3c; }
  .m-stage { position: relative; flex: 1 1 0; min-height: 0; }
  .m-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  .m-label { position: absolute; z-index: 2; background: rgba(12,16,26,.94); border: 1px solid var(--cell-line); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; color: var(--text); max-width: 80%; display: flex; gap: 8px; align-items: center; }
  .m-label[hidden] { display: none; }
  .m-label .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-label button { background: var(--cell); border: 1px solid var(--cell-line); color: var(--gold); border-radius: 4px; padding: 4px 6px; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>
<div id="wait">Waiting for the game page…<br>(Open this from ⧉ Map (follows) on the SMZ3 or Rando Cross page.)</div>
<div class="pane" id="p-z3"></div>
<div class="pane" id="p-sm"><div id="g-smmap"></div></div>
<div class="pane" id="p-nes"></div>
<div id="hidden-map"></div>
<script>
  // the page that opened this window: its game, tracker and stores, as if they were here
  // (the frames below look for them on their parent)
  (function () {
    function src() { try { return opener && !opener.closed ? opener : null; } catch (e) { return null; } }
    // the frames ask their parent for these names
    ['Snes9xPlayer', 'SMZ3Store', 'QuadApp', 'QuadLink', 'QuadNESLink'].forEach(function (k) {
      Object.defineProperty(window, k, { configurable: true, get: function () { var o = src(); return o ? o[k] : undefined; } });
    });
    Object.defineProperty(window, 'SMZ3Gen', { configurable: true, get: function () { var o = src(); return o ? o.SMZ3Gen : undefined; } });
  })();
</script>
<script src="../world-map.js"></script>
<script src="../sm/js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/map.js" data-hub="../"></script>
<script>
  (function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var pin = new URLSearchParams(location.search).get('game');
    var opener_ = function () { try { return opener && !opener.closed ? opener : null; } catch (e) { return null; } };
    var cur = null, frames = {}, smReady = false, lastState = null;
    var MAP = window.SMZ3Map;   // this window's own copy of the map code (the page's draws into the page)

    function zeldaMode() { var o = opener_(), p = o && o.SMZ3Z3Pick, m = p && p.mode(); return m === 'mudora' || m === 'hutch' ? m : 'mudora2'; }
    function frame(id, src) {
      if (frames[id]) return;
      var f = document.createElement('iframe'); f.src = src; f.title = id; $(id).appendChild(f); frames[id] = f;
    }
    function smSetup() {
      var o = opener_(); if (smReady || !o || !o.SMZ3Map || !o.SMZ3Map.config || !o.SMZ3Map.config.locs) return false;
      MAP.init($('hidden-map'), o.SMZ3Map.config);
      MAP.initSM($('g-smmap'));
      smReady = true; return true;
    }
    // which game is being played: the NES ones (Rando Cross) from its link, Hyrule / Zebes from the SNES game's save RAM
    function which() {
      var o = opener_(); if (!o) return null;
      if (pin) return pin;
      var L = o.QuadLink; if (L && (L.where === 'z1' || L.where === 'm1')) return L.where;
      var P = o.Snes9xPlayer, c = P && P.ready && P.core, s = null;
      try { s = c && c.sram(); } catch (e) {}
      if (!s || s.length <= 0x33FE) return null;
      return s[0x33FE] === 0 ? 'z3' : s[0x33FE] === 0xFF ? 'sm' : cur;
    }
    function show(g) {
      if (g === cur) return; cur = g;
      $('wait').style.display = g ? 'none' : '';
      $('p-z3').classList.toggle('on', g === 'z3'); $('p-sm').classList.toggle('on', g === 'sm'); $('p-nes').classList.toggle('on', g === 'z1' || g === 'm1');
      if (g === 'z3') frame('p-z3', 'z3host.html?t=' + zeldaMode() + '&phone=maps');
      if (g === 'z1' || g === 'm1') frame('p-nes', '../cross/nes-tracker.html?view=map');
      if (g === 'sm') setTimeout(function () { MAP.redraw(); }, 50);
      document.title = { z3: 'Hyrule (ALttP)', sm: 'Zebes (Super Metroid)', z1: 'Hyrule (Zelda 1)', m1: 'Zebes (Metroid)' }[g] + ' · map';
    }
    setInterval(function () {
      var o = opener_();
      if (!o) { $('wait').textContent = 'The game page is closed: open this again from ⧉ Map (follows).'; $('wait').style.display = ''; return; }
      show(which());
      if (smSetup() || smReady) {
        var st = o.SMZ3Map.state; if (st && st !== lastState) { lastState = st; MAP.update(st); }
        var a = o.SMZ3Map.liveArgs; if (a) MAP.live(a[0], a[1]);
      }
    }, 250);
    addEventListener('resize', function () { if (cur === 'sm') MAP.redraw(); });
  })();
</script>
</body>
</html>
