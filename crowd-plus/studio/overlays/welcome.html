<!doctype html>
<html><head><meta charset="utf-8"><title>Welcome back</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/studio/overlay.css">
<style>
  /* 520 x 140. A small pop-up when a regular viewer shows up again. */
  body { padding: calc(10px * var(--scale)); }
  .card { display: flex; align-items: center; gap: calc(14px * var(--scale)); padding: calc(10px * var(--scale)) calc(18px * var(--scale)) calc(10px * var(--scale)) calc(12px * var(--scale));
    width: max-content; max-width: calc(480px * var(--scale)); border-color: #ffd166; opacity: 0; transform: translateX(calc(-30px * var(--scale))); transition: opacity .4s, transform .4s cubic-bezier(.2, 1.3, .4, 1); }
  .card.on { opacity: 1; transform: none; }
  .av { width: calc(52px * var(--scale)); height: calc(52px * var(--scale)); border-radius: 50%; background: var(--navy); display: grid; place-items: center; overflow: hidden; font: 800 calc(22px * var(--scale)) var(--sans); flex: none; border: calc(2px * var(--scale)) solid #ffd166; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .t { font-size: calc(11px * var(--scale)); color: #ffd166; }
  .n { font: 800 calc(24px * var(--scale))/1.15 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(380px * var(--scale)); }
  .s { font: 600 calc(13px * var(--scale)) var(--sans); color: #e9e4f7; }
</style></head>
<body>
<div class="card box" id="card"><div class="av" id="av"></div><div><div class="t pix" id="t">WELCOME BACK</div><div class="n shadow" id="n"></div><div class="s" id="s"></div></div></div>
<div class="offline-note">Waiting for the Crowd Control+ bridge…</div>
<script src="/studio/common.js"></script>
<script>
const $ = (i) => document.getElementById(i); const queue = []; let busy = false;
function show(e) {
  busy = true;
  const nm = CC.name(e);
  $('n').textContent = nm; $('t').textContent = e.welcome.title || 'WELCOME BACK';
  $('s').textContent = 'Stream #' + e.welcome.streams + ' together 💖';
  $('av').innerHTML = e.avatar && /^https:\/\//.test(e.avatar) ? '<img src="' + CC.esc(e.avatar) + '" alt="">' : CC.esc((nm[0] || '?').toUpperCase());
  $('card').classList.add('on');
  setTimeout(() => { $('card').classList.remove('on'); setTimeout(() => { busy = false; if (queue.length) show(queue.shift()); }, 600); }, 5000);
}
CC.on('event', (d) => { if (d.ev.welcome) { if (busy) { queue.push(d.ev); if (queue.length > 8) queue.shift(); } else show(d.ev); } });
CC.on('state', () => { if (CC.q.get('preview') === '1' && !busy) show({ user: 'RegularViewer', welcome: { streams: 12, title: 'WELCOME BACK' } }); });
</script>
</body></html>
