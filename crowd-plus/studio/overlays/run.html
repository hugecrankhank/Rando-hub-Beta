<!doctype html>
<html><head><meta charset="utf-8"><title>Run stats</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/studio/overlay.css">
<style>
  /* 1000 x 90 (one row). ?layout=column for a 320 x 330 box. Data comes from the game. */
  body { padding: calc(8px * var(--scale)); }
  .bar { display: flex; align-items: center; gap: calc(18px * var(--scale)); padding: calc(10px * var(--scale)) calc(16px * var(--scale)); width: max-content; max-width: calc(980px * var(--scale)); }
  .col .bar { flex-direction: column; align-items: stretch; gap: calc(10px * var(--scale)); width: calc(300px * var(--scale)); }
  .st { display: flex; align-items: center; gap: calc(8px * var(--scale)); white-space: nowrap; }
  .st .ic { font-size: calc(20px * var(--scale)); }
  .st .k { font-size: calc(9px * var(--scale)); color: #ff8a92; display: block; }
  .st .v { font: 800 calc(19px * var(--scale)) var(--sans); display: block; max-width: calc(260px * var(--scale)); overflow: hidden; text-overflow: ellipsis; }
  .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.15); } .col .sep { display: none; }
  .bump { animation: bump .6s; } @keyframes bump { 30% { transform: scale(1.3); color: #ff6b74; } }
</style></head>
<body>
<div class="bar box" id="bar">
  <img class="die" src="/studio/die.svg" alt="">
  <div class="st"><span class="ic">☠</span><span><span class="k pix">DEATHS</span><span class="v shadow" id="deaths">0</span></span></div><div class="sep"></div>
  <div class="st"><span class="ic">✔</span><span><span class="k pix">CHECKS</span><span class="v shadow" id="checks">0</span></span></div><div class="sep"></div>
  <div class="st"><span class="ic">📍</span><span><span class="k pix">WHERE</span><span class="v shadow" id="place">—</span></span></div><div class="sep"></div>
  <div class="st" id="music-st"><span class="ic">♪</span><span><span class="k pix">MUSIC</span><span class="v shadow" id="music">Game music</span></span></div><div class="sep" id="seed-sep"></div>
  <div class="st" id="seed-st"><span class="ic">🎲</span><span><span class="k pix">SEED</span><span class="v shadow" id="seed">—</span></span></div>
</div>
<div class="offline-note">Waiting for the Crowd Control+ bridge…</div>
<script src="/studio/common.js"></script>
<script>
const $ = (i) => document.getElementById(i);
if (CC.q.get('layout') === 'column') document.body.classList.add('col');
const hide = (CC.q.get('hide') || '').split(',');
if (hide.includes('seed')) { $('seed-st').hidden = true; $('seed-sep').hidden = true; }
if (hide.includes('music')) $('music-st').hidden = true;
let last = {};
function set(id, v) { const el = $(id); if (el.textContent !== String(v)) { el.textContent = v; if (last[id] !== undefined) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } last[id] = v; } }
function paint(r) {
  if (!r) return;
  set('deaths', r.deaths || 0); set('checks', r.checks || 0); set('place', r.place || '—');
  set('music', r.music || 'Game music'); set('seed', (r.seed || '—').replace(/^ALttPR\s*-\s*/i, ''));
}
CC.on('state', (d) => paint(d.live && d.live.run));
CC.on('live', (d) => { if (d.run) paint(d.run); if (d.what === 'music') paint(Object.assign({}, CC.state.live.run, { music: d.pack })); });
</script>
</body></html>
