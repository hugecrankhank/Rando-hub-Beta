<!doctype html>
<html><head><meta charset="utf-8"><title>Team battle</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/studio/overlay.css">
<style>
  /* 900 x 200. Tug of war between two teams. */
  body { padding: calc(10px * var(--scale)); }
  .card { width: calc(860px * var(--scale)); padding: calc(12px * var(--scale)) calc(16px * var(--scale)); display: none; }
  .card.on { display: block; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: calc(12px * var(--scale)); }
  .team { font-size: calc(15px * var(--scale)); display: flex; align-items: center; gap: calc(8px * var(--scale)); }
  .team.l { color: #9be7ff; } .team.d { color: #d7a6ff; }
  .score { font: 800 calc(22px * var(--scale)) var(--sans); font-variant-numeric: tabular-nums; }
  .mid { text-align: center; font: 700 calc(13px * var(--scale)) var(--sans); color: #c9c0e6; }
  .bar { position: relative; height: calc(30px * var(--scale)); border-radius: calc(8px * var(--scale)); overflow: hidden; margin: calc(10px * var(--scale)) 0 calc(6px * var(--scale)); display: flex;
    border: calc(2px * var(--scale)) solid rgba(255,255,255,.2); }
  .bar .a { background: linear-gradient(90deg, #1d6fa5, #48b4e0); transition: flex-grow .6s cubic-bezier(.3, 1.3, .5, 1); }
  .bar .b { background: linear-gradient(90deg, #8a3fc7, #5a1d8f); transition: flex-grow .6s cubic-bezier(.3, 1.3, .5, 1); }
  .bar .knot { position: absolute; top: 50%; width: calc(26px * var(--scale)); height: calc(26px * var(--scale)); transform: translate(-50%, -50%); transition: left .6s cubic-bezier(.3, 1.3, .5, 1); }
  .foot { display: flex; justify-content: space-between; font: 600 calc(12px * var(--scale)) var(--sans); color: #c9c0e6; }
  .win { text-align: center; font-size: calc(20px * var(--scale)); color: #ffd166; margin-top: calc(6px * var(--scale)); animation: flash .6s ease-in-out infinite alternate; }
  @keyframes flash { to { opacity: .5; } }
</style></head>
<body>
<div class="card box" id="card">
  <div class="row"><div class="team l pix shadow" id="na"></div><div class="mid" id="mid"></div><div class="team d pix shadow" id="nb"></div></div>
  <div class="row"><div class="score shadow" id="sa"></div><div class="score shadow" id="sb"></div></div>
  <div class="bar"><div class="a" id="ba"></div><div class="b" id="bb"></div><img class="knot" id="knot" src="/studio/die.svg" alt=""></div>
  <div class="foot"><span id="ja"></span><span id="jb"></span></div>
  <div class="win pix" id="win" hidden></div>
</div>
<div class="offline-note">Waiting for the Crowd Control+ bridge…</div>
<script src="/studio/common.js"></script>
<script>
const $ = (i) => document.getElementById(i); let B = null;
function paint() {
  $('card').classList.toggle('on', !!B); if (!B) return;
  const [a, b] = B.scores, tot = a + b, share = tot ? a / tot : .5;
  const join = (CC.state && CC.state.settings.battle.join) || ['!light', '!dark'];
  $('na').textContent = B.names[0]; $('nb').textContent = B.names[1];
  $('sa').textContent = CC.num(a); $('sb').textContent = CC.num(b);
  $('ba').style.flexGrow = Math.max(.02, share); $('bb').style.flexGrow = Math.max(.02, 1 - share);
  $('knot').style.left = (share * 100) + '%';
  $('mid').textContent = B.done ? '' : B.target ? 'First to ' + CC.num(B.target) + ' coins' : '';
  $('ja').textContent = B.members[0] + ' on the team · type ' + join[0];
  $('jb').textContent = 'type ' + join[1] + ' · ' + B.members[1] + ' on the team';
  $('win').hidden = !B.done; if (B.done) $('win').textContent = B.names[B.winner] + ' WINS!';
}
setInterval(() => { if (B && !B.done && B.endsAt) { const s = Math.max(0, Math.ceil((B.endsAt - Date.now()) / 1000)); $('mid').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + (B.target ? ' · first to ' + CC.num(B.target) : ''); } }, 500);
CC.on('state', (d) => { B = d.live && d.live.battle; if (!B && CC.q.get('preview') === '1') B = { names: ['LIGHT WORLD', 'DARK WORLD'], scores: [1240, 860], members: [14, 9], target: 2000, done: false }; paint(); });
CC.on('live', (d) => { if ('battle' in d) { B = d.battle; paint(); } });
</script>
</body></html>
