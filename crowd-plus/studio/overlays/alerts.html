<!doctype html>
<html><head><meta charset="utf-8"><title>Gift alerts</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/studio/overlay.css">
<style>
  /* Full-screen browser source (1920x1080). Alerts appear one at a time,
     centered near the top. ?pos=bottom puts them near the bottom. */
  body { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
  body.bottom { align-items: flex-end; }
  .stage { margin: calc(60px * var(--scale)) 0; position: relative; }
  .alert { display: flex; align-items: center; gap: calc(22px * var(--scale)); padding: calc(18px * var(--scale)) calc(30px * var(--scale)) calc(18px * var(--scale)) calc(20px * var(--scale));
    min-width: calc(560px * var(--scale)); max-width: calc(1100px * var(--scale)); position: relative; opacity: 0; transform: translateY(-30px) scale(.9); }
  .alert.in { animation: pop .55s cubic-bezier(.2, 1.4, .4, 1) forwards; }
  .alert.out { animation: drop .45s ease-in forwards; }
  @keyframes pop { to { opacity: 1; transform: none; } }
  @keyframes drop { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-20px) scale(.95); } }
  .art { position: relative; width: calc(110px * var(--scale)); height: calc(110px * var(--scale)); flex: none; display: grid; place-items: center; }
  .art img.gift { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); animation: bob 1.4s ease-in-out infinite; }
  .art .emoji { font-size: calc(78px * var(--scale)); animation: bob 1.4s ease-in-out infinite; }
  .art img.avatar { position: absolute; right: calc(-8px * var(--scale)); bottom: calc(-8px * var(--scale)); width: calc(44px * var(--scale)); height: calc(44px * var(--scale)); border-radius: 50%; border: calc(3px * var(--scale)) solid var(--red); background: #222; }
  @keyframes bob { 50% { transform: translateY(calc(-6px * var(--scale))) rotate(-4deg); } }
  .txt { display: flex; flex-direction: column; gap: calc(9px * var(--scale)); min-width: 0; }
  .title { font-size: calc(17px * var(--scale)); color: var(--red); }
  .who { font: 800 calc(34px * var(--scale))/1.1 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .what { font: 600 calc(22px * var(--scale))/1.25 var(--sans); color: #e9e4f7; }
  .what b { color: #fff; }
  .fx { display: inline-flex; align-items: center; gap: calc(8px * var(--scale)); align-self: flex-start; background: var(--red); color: #fff; padding: calc(6px * var(--scale)) calc(12px * var(--scale));
    border-radius: calc(8px * var(--scale)); font-size: calc(13px * var(--scale)); }
  /* sizes */
  .alert.big { min-width: calc(680px * var(--scale)); }
  .alert.big .who { font-size: calc(40px * var(--scale)); }
  .alert.big .art { width: calc(140px * var(--scale)); height: calc(140px * var(--scale)); }
  .alert.huge { min-width: calc(820px * var(--scale)); border-width: calc(5px * var(--scale)); animation: none; }
  .alert.huge.in { animation: pop .6s cubic-bezier(.2, 1.4, .4, 1) forwards, glow 1.2s ease-in-out .6s infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 calc(40px * var(--scale)) rgba(230,57,70,.85); } }
  .alert.huge .who { font-size: calc(48px * var(--scale)); }
  .alert.huge .title { font-size: calc(22px * var(--scale)); }
  .alert.huge .art { width: calc(170px * var(--scale)); height: calc(170px * var(--scale)); }
  .alert.follow .title, .alert.share .title { color: #ffd166; }
  .alert.death { border-color: #9aa3b5; } .alert.death .title { color: #c9d1e0; }
  .alert.detour { border-color: #ffd166; } .alert.detour .title { color: #ffd166; }
  .alert.box { border-color: #ffd166; } .alert.box .title { color: #ffd166; }
  .alert.box .cd { display: inline-block; min-width: 3.2em; font: 800 calc(30px * var(--scale))/1 var(--sans); color: #ffd166; font-variant-numeric: tabular-nums; }
  .alert.box.open { animation: glow 1s ease-in-out infinite; } .alert.box.open .cd { color: #7bff8e; }
  .bar { position: absolute; left: calc(14px * var(--scale)); right: calc(14px * var(--scale)); bottom: calc(6px * var(--scale)); height: calc(4px * var(--scale)); border-radius: 9px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--red); transform-origin: left; }
  canvas { position: fixed; inset: 0; pointer-events: none; }
</style></head>
<body>
<canvas id="fx"></canvas>
<div class="stage" id="stage"></div>
<div class="offline-note">Waiting for the Crowd Control+ bridge…</div>
<script src="/studio/common.js"></script>
<script>
const q = CC.q, stage = document.getElementById('stage');
if (q.get('pos') === 'bottom') document.body.classList.add('bottom');
const preview = q.get('preview') === '1';
const queue = []; let busy = false;
let sounds = []; fetch('/sounds.json').then((r) => r.json()).then((f) => sounds = f).catch(() => {});

// ── sound: a custom file from the sounds folder, or a built-in chime ──
let ac = null;
function chime(kind, vol) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { small: [784, 1047], big: [659, 880, 1175], huge: [523, 659, 784, 1047, 1319], follow: [880, 1175], share: [988, 1319], death: [392, 311, 262, 196], detour: [196, 233, 196, 262, 311] }[kind] || [880, 1175];
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * (kind === 'huge' ? .11 : .09);
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12 * vol, t + .01); g.gain.exponentialRampToValueAtTime(.0005, t + .28);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .3);
    });
  } catch (e) {}
}
function play(kind) {
  const A = CC.state && CC.state.settings.alerts; if (!A || !A.sound || preview) return;
  const f = sounds.find((x) => x.replace(/\.[^.]+$/, '').toLowerCase() === kind);
  if (f) { const a = new Audio('/sounds/' + encodeURIComponent(f)); a.volume = Math.max(0, Math.min(1, +A.volume)); a.play().catch(() => chime(kind, +A.volume)); }
  else chime(kind, +A.volume);
}

// ── confetti for big and huge ──
const cv = document.getElementById('fx'), cx = cv.getContext('2d'); let bits = [];
function resize() { cv.width = innerWidth; cv.height = innerHeight; } resize(); addEventListener('resize', resize);
function burst(n) {
  const r = stage.getBoundingClientRect(); const x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
  for (let i = 0; i < n; i++) bits.push({ x: x0, y: y0, vx: (Math.random() - .5) * 18, vy: -Math.random() * 14 - 4, s: 6 + Math.random() * 8, c: ['#e63946', '#ffffff', '#14213d', '#ffd166'][i % 4], r: Math.random() * 6, life: 120 });
}
(function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  bits = bits.filter((b) => b.life-- > 0 && b.y < cv.height + 20);
  for (const b of bits) { b.vy += .45; b.x += b.vx; b.y += b.vy; b.r += .2; cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.s / 2, -b.s / 2, b.s, b.s); cx.restore(); }
  requestAnimationFrame(loop);
})();

function show(ev) {
  const A = CC.state.settings.alerts;
  // a treasure box: the alert shows the countdown for a while (the Treasure box
  // overlay carries it to the end), then pops up again when the box opens
  const boxLeft = ev.type === 'box' ? Math.max(0, Math.min(3600, ((ev.opensAt || 0) - Date.now()) / 1000)) : 0;
  const secs = ev.type === 'box' && !ev.boxOpen ? Math.min(boxLeft + 5, Math.max(8, +A.seconds || 6)) : Math.max(2, +A.seconds || 6);
  const kind = ev.alert.tier;
  const el = document.createElement('div');
  el.className = 'alert box ' + kind;
  const art = ev.type === 'gift'
    ? (ev.icon ? '<img class="gift" src="' + CC.esc(ev.icon) + '" alt="">' : '<span class="emoji">🎁</span>')
    : '<span class="emoji">' + (ev.type === 'follow' ? '💖' : ev.type === 'superfan' ? '⭐' : ev.type === 'community' ? '🤝' : ev.type === 'death' ? '☠️' : ev.type === 'detour' ? '⚔️' : ev.type === 'boss' ? '🏆' : ev.type === 'gtkey' ? '🔑' : ev.type === 'digprize' ? '⛏️' : ev.type === 'detour-end' ? (ev.result === 'won' ? '🏆' : ev.result === 'survived' ? '🛡️' : '💫') : ev.type === 'box' ? '🧧' : '📣') + '</span>';
  const avatar = ev.avatar && /^https:\/\//.test(ev.avatar) ? '<img class="avatar" src="' + CC.esc(ev.avatar) + '" alt="" onerror="this.remove()">' : '';
  let what = '';
  if (ev.type === 'gift') what = 'sent <b>' + (ev.count > 1 ? ev.count + 'x ' : '') + CC.esc(ev.gift) + '</b>' + (ev.coins ? ' · ' + CC.num(ev.coins) + ' coins' : '');
  else if (ev.type === 'follow') what = 'just followed!';
  else if (ev.type === 'superfan') what = 'is a new Super Fan!';
  else if (ev.type === 'community') what = 'joined the community!';
  else if (ev.type === 'detour') what = 'sent Link to fight <b>' + CC.esc(ev.text) + '</b>! ' + (ev.secs || 60) + ' seconds…';
  else if (ev.type === 'detour-end') what = CC.esc(ev.text) + (ev.bonus ? ' · bonus: ' + CC.esc(ev.bonus) : ' · back to the run');
  else if (ev.type === 'gtkey' || ev.type === 'digprize') what = CC.esc(ev.text) + (ev.bonus ? ' · ' + CC.esc(ev.bonus) : '');
  else if (ev.type === 'boss') what = 'beat <b>' + CC.esc(ev.text) + '</b>!' + (ev.bonus ? ' · ' + CC.esc(ev.bonus) : '');
  else if (ev.type === 'box' && ev.boxOpen) what = 'the <b>' + (ev.superfan ? 'Super Fan box' : 'treasure box') + '</b>' + (ev.diamonds ? ' · ' + CC.num(ev.diamonds) + ' coins' : '') + ' is open: <span class="cd">TAP IT!</span>';
  else if (ev.type === 'box') what = 'sent a <b>' + (ev.superfan ? 'Super Fan box' : 'treasure box') + '</b>' + (ev.diamonds ? ' · ' + CC.num(ev.diamonds) + ' coins' : '') + (ev.people ? ' for ' + ev.people + ' people' : '') + '<br>opens in <span class="cd">' + CC.fmt(boxLeft).replace(/^0:/, '') + '</span>';
  else if (ev.type === 'death') what = 'died! That\'s death #' + (ev.deaths || 1) + (ev.text ? ' · ' + CC.esc(ev.text) : '');
  else what = 'shared the LIVE!';
  const fx = !/^(death|detour|boss|gtkey|digprize|box)/.test(ev.type) && A.showEffect && (ev.effectName || ev.tier) ? '<div class="fx pix"><img class="die" src="/studio/die.svg" alt="" style="width:1.6em;height:1.6em">' + CC.esc(ev.effectName || ev.tier) + '</div>' : '';
  el.innerHTML = '<div class="art">' + art + avatar + '</div><div class="txt"><div class="title pix">' + CC.esc(ev.alert.title || '') + '</div>' +
    '<div class="who shadow">' + CC.esc(CC.name(ev)) + '</div><div class="what">' + what + '</div>' + fx + '</div>' +
    '<div class="bar"><i style="animation: shrink ' + secs + 's linear forwards"></i></div>';
  stage.innerHTML = ''; stage.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  play(kind === 'box' ? 'big' : kind);
  if (ev.type === 'box' && ev.boxOpen) { el.classList.add('open'); burst(120); }
  else if (ev.type === 'box') {
    const cd = el.querySelector('.cd'), end = ev.opensAt || Date.now();
    const t = setInterval(() => {
      if (!el.isConnected) { clearInterval(t); return; }
      const left = Math.max(0, (end - Date.now()) / 1000);
      cd.textContent = left > 0 ? CC.fmt(left).replace(/^0:/, '') : 'NOW!';
    }, 250);
    if (boxLeft > secs) setTimeout(() => { queue.unshift({ ...ev, boxOpen: true, alert: { tier: 'box', title: (ev.superfan ? 'SUPER FAN BOX' : 'TREASURE BOX') + ' IS OPEN!' } }); next(); }, boxLeft * 1000);
  }
  if (kind === 'big') burst(70); if (kind === 'huge') { burst(160); setTimeout(() => burst(120), 700); }
  return new Promise((done) => {
    setTimeout(() => { el.classList.remove('in'); el.classList.add('out'); setTimeout(() => { el.remove(); done(); }, 450); }, secs * 1000);
  });
}
const st = document.createElement('style'); st.textContent = '@keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }'; document.head.appendChild(st);

async function next() {
  if (busy || !queue.length) return;
  busy = true; await show(queue.shift()); busy = false; setTimeout(next, 250);
}
CC.on('event', (d) => { if (d.ev.alert) { queue.push(d.ev); if (queue.length > 30) queue.shift(); next(); } });
CC.on('clear', () => { queue.length = 0; stage.innerHTML = ''; bits = []; busy = false; });
// panel preview: show a sample so the frame isn't empty
CC.on('state', () => {
  if (preview && !stage.children.length) show({ type: 'gift', user: 'PreviewViewer', gift: 'Galaxy', count: 1, coins: 1000, icon: '/icons/Galaxy.png', effectName: 'New seed (same settings)', alert: { tier: 'big', title: 'BIG GIFT!' } });
});
</script>
</body></html>
