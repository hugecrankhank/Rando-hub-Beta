# One-time cleanup: Crowd Control+ is shared privately now. Deletes every
# Crowd-Control-Plus zip from this repo's Releases (and the merged
# jinxcast-link branch). Removed again right after it runs.
name: Remove Crowd Control+ downloads
on:
  push:
    paths: ['.github/workflows/cleanup-crowd-control-plus.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Crowd-Control-Plus release zips
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/releases?per_page=100" --paginate -q '.[].assets[] | select(.name|test("^Crowd-Control-Plus")) | "\(.id) \(.name)"')
          echo "$ids"
          echo "$ids" | while read id name; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/$REPO/releases/assets/$id" && echo "deleted $name"
          done
          left=$(gh api "repos/$REPO/releases?per_page=100" --paginate -q '[.[].assets[] | select(.name|test("^Crowd-Control-Plus"))] | length' | paste -sd+ | bc)
          echo "left: $left"
          [ "$left" = "0" ]
      - name: Delete the merged jinxcast-link branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X DELETE "repos/$REPO/git/refs/heads/jinxcast-link" || echo "no jinxcast-link branch"
