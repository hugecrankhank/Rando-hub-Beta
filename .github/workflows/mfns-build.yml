name: Build MFNS tracker (test build, not deployed)
on:
  push:
    branches: [mfns-build]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the tracker (KrisDavie/alttptracker, react_rewrite)
        run: |
          COMMIT=$(cat mfns-tracker/COMMIT 2>/dev/null || echo react_rewrite)
          git clone -q -b react_rewrite https://github.com/KrisDavie/alttptracker.git src-mfns
          cd src-mfns && git checkout -q "$COMMIT" && git log -1 --format='%H %ad %s' --date=iso
      - uses: oven-sh/setup-bun@v2
      - name: Build (unchanged source; served from /Rando-hub-Beta/mfns-tracker/app/)
        run: |
          cd src-mfns
          bun install --frozen-lockfile || bun install
          bunx vite build --base=/Rando-hub-Beta/mfns-tracker/app/
          git rev-parse HEAD > dist/SOURCE_COMMIT
          # Mudora 2.0: his map squares and dungeon lists, read from his data
          cp ../tools/mfns-extract.ts . && bun run mfns-extract.ts > ../mfns-data.json && rm mfns-extract.ts
      # the built files go back into this branch (mfns-tracker/app/), so they
      # can be tested before anything is published
      - name: Commit the build to this branch
        run: |
          rm -rf mfns-tracker/app && mkdir -p mfns-tracker && cp -r src-mfns/dist mfns-tracker/app
          # Mudora 2.0 only needs his logic: drop his old overlay images (unused by the build) and the sprite previews but Link's
          rm -rf mfns-tracker/app/overlay && find mfns-tracker/app/sprites -type f ! -name 'link_*' -delete
          cp src-mfns/LICENSE mfns-tracker/LICENSE
          python3 tools/mfns-settings.py src-mfns > mfns-tracker/settings.json
          rm -rf src-mfns
          mv mfns-data.json mfns-tracker/data.json
          python3 tools/mfns-page.py
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add mfns-tracker/app mfns-tracker/index.html mfns-tracker/data.json mfns-tracker/settings.json mfns-tracker/LICENSE
          git diff --cached --quiet || git commit -qm "MFNS tracker build $(cat mfns-tracker/app/SOURCE_COMMIT | cut -c1-7) [skip ci]"
          git push -q origin HEAD:mfns-build
