<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rando Cross - Rando Hub</title>
<!-- Rando Cross was Quad, at quad/: this sends old bookmarks, the installed app and links to its address now, cross/ -->
<script>
  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (/\/quad\/$/.test(r.scope)) r.unregister(); }); }); } catch (e) {}
  location.replace('../cross/' + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=../cross/">
</head>
<body style="background:#110c1e;color:#f2f0f8;font:15px system-ui,sans-serif;padding:24px">
<p>Rando Cross has moved: <a href="../cross/" style="color:#f0c840">open it here</a>.</p>
</body>
</html>
